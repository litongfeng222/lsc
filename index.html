<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#5b6ee8">
  <meta name="description" content="师大附·11班·学习小组 — 资源共享与学习交流社区">
  <title>师大附·11班·学习小组</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 磨砂玻璃导航栏 -->
  <nav id="navbar" class="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="#home">
        <span class="nav-logo-icon">📚</span>
        <span class="nav-logo-text">11班·学习小组</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="#resources" class="nav-link" data-page="resources">资源中心</a></li>
        <li><a href="#forum" class="nav-link" data-page="forum">学习论坛</a></li>
        <li><a href="#upload" class="nav-link" data-page="upload">分享资料</a></li>
        <li><a href="#ranking" class="nav-link" data-page="ranking">排行榜</a></li>
      </ul>
    </div>
  </nav>

  <!-- 首页 Hero -->
  <header id="home" class="hero">
    <div class="hero-content">
      <h1 class="hero-title">师大附 · 11班 · 学习小组</h1>
      <p class="hero-subtitle">资源共享 · 互助进步 · 共同成长</p>
      <div class="hero-actions">
        <a href="#resources" class="btn btn-primary">浏览资源</a>
        <a href="#upload" class="btn btn-ghost">分享资料</a>
      </div>
    </div>
    <div class="hero-stats" id="heroStats">
      <div class="stat-item"><span class="stat-num" id="statFiles">0</span><span class="stat-label">份资料</span></div>
      <div class="stat-item"><span class="stat-num" id="statSubjects">12</span><span class="stat-label">个科目</span></div>
      <div class="stat-item"><span class="stat-num" id="statUsers">—</span><span class="stat-label">位同学</span></div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main">

    <!-- 资源中心 -->
    <section id="resources" class="page-section">
      <div class="section-header">
        <h2 class="section-title">资源中心</h2>
        <p class="section-desc">浏览、搜索、下载学习资料</p>
      </div>
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索资料名称…" autocomplete="off">
        </div>
        <div class="filter-bar" id="filterBar">
          <!-- 科目筛选标签由 JS 动态生成 -->
        </div>
        <div class="sort-bar">
          <button class="sort-btn active" data-sort="date">最新</button>
          <button class="sort-btn" data-sort="downloads">下载量</button>
          <button class="sort-btn" data-sort="rating">评分</button>
        </div>
      </div>
      <div class="resource-grid" id="resourceGrid">
        <!-- 资源卡片由 JS 动态生成 -->
      </div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div class="empty-icon">📂</div>
        <p>暂无资料，快来分享第一份吧～</p>
      </div>
    </section>

    <!-- 学习论坛 -->
    <section id="forum" class="page-section" style="display:none">
      <div class="section-header">
        <h2 class="section-title">学习论坛</h2>
        <p class="section-desc">提问、讨论、互助</p>
      </div>
      <div class="forum-tabs" id="forumTabs">
        <button class="forum-tab active" data-board="qa">学科答疑</button>
        <button class="forum-tab" data-board="homework">班级作业</button>
        <button class="forum-tab" data-board="other">其他信息</button>
      </div>
      <div class="forum-actions">
        <button class="btn btn-primary btn-sm" id="newPostBtn">发帖</button>
      </div>
      <div class="post-list" id="postList">
        <!-- 帖子由 JS 动态生成 -->
      </div>
      <div class="empty-state" id="forumEmpty" style="display:none">
        <div class="empty-icon">💬</div>
        <p>还没有帖子，来发第一条吧～</p>
      </div>
    </section>

    <!-- 分享资料 -->
    <section id="upload" class="page-section" style="display:none">
      <div class="section-header">
        <h2 class="section-title">分享资料</h2>
        <p class="section-desc">上传学习资料，帮助同学</p>
      </div>
      <div class="upload-form-wrap">
        <form id="uploadForm" class="upload-form">
          <div class="form-group">
            <label for="uploadName">资料名称 <span class="required">*</span></label>
            <input type="text" id="uploadName" placeholder="例如：高一数学月考卷" required>
          </div>
          <div class="form-group">
            <label for="uploadSubject">所属科目 <span class="required">*</span></label>
            <select id="uploadSubject" required>
              <option value="">请选择科目</option>
            </select>
          </div>
          <div class="form-group">
            <label for="uploadDesc">简介（选填）</label>
            <textarea id="uploadDesc" rows="2" placeholder="一句话描述这份资料"></textarea>
          </div>
          <div class="form-group">
            <label for="uploadFile">选择文件 <span class="required">*</span></label>
            <input type="file" id="uploadFile" required>
            <p class="form-hint">支持 PDF、DOCX、PPTX、XLSX、图片等格式</p>
          </div>
          <div class="form-group">
            <label for="uploaderName">你的昵称（选填）</label>
            <input type="text" id="uploaderName" placeholder="留空则显示"匿名同学"">
          </div>
          <button type="submit" class="btn btn-primary btn-block">上传资料</button>
        </form>
      </div>
    </section>

    <!-- 排行榜 -->
    <section id="ranking" class="page-section" style="display:none">
      <div class="section-header">
        <h2 class="section-title">排行榜</h2>
        <p class="section-desc">下载量最高 · 评分最高</p>
      </div>
      <div class="ranking-tabs">
        <button class="ranking-tab active" data-type="downloads">下载榜</button>
        <button class="ranking-tab" data-type="rating">评分榜</button>
      </div>
      <div class="ranking-list" id="rankingList">
        <!-- 排行榜由 JS 动态生成 -->
      </div>
      <div class="empty-state" id="rankingEmpty" style="display:none">
        <div class="empty-icon">🏆</div>
        <p>暂无排行数据</p>
      </div>
    </section>

  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <p>师大附 · 11班 · 学习小组</p>
    <p class="footer-sub">共建共享 · 互助进步</p>
    <button class="admin-entry" id="adminEntry" title="管理员入口">⚙️</button>
  </footer>

  <!-- 预览弹窗 -->
  <div class="modal-overlay" id="previewModal" style="display:none">
    <div class="modal-content modal-preview">
      <button class="modal-close" id="previewClose">✕</button>
      <div id="previewBody" class="preview-body"></div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 脚本 -->
  <script src="js/app.js"></script>
</body>
</html>
